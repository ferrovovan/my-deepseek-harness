name: Desktop · Windows installer (fork)

# Форк-сборка: НЕподписанный Windows-установщик собирается ТОЛЬКО по тегу вида
# main-<version> — сам тег выражает доверие к коммиту, обычный пуш в main ничего
# не собирает. Апстримный windows-package.yml привязан к приватным self-hosted
# раннерам (dsh-win-package-trial) и подписи EV-токеном — в форке недоступен.
# Здесь GitHub-hosted windows-2025, конфигурация берётся из генерируемого
# apps/desktop/.env.windows (git-игнорируемый dotenv; пример — .env.windows.example).

on:
  push:
    tags:
      - 'main-*'
      # Заготовочные теги ветки (main-pre-update-*) не доверенные — не собираем.
      - '!main-pre-update-*'

permissions:
  contents: read

concurrency:
  group: desktop-windows-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-2025
    timeout-minutes: 120
    # Публикация Release штатным GITHUB_TOKEN: личных секретов по-прежнему нет.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      DSH_TELEMETRY_DISABLED: '1'
      # Название продукта печатает официальный пул локалей: значение ключа
      # `brand.localBuild` в packages/client/locale/src/locales/*.ts (личная
      # правка значений — en «Featured DSH», ru «Изменённый DSH», zh «定制 DSH»).
      # Локаль выбирает сам locale-плагин, поэтому DSH_CLIENT_TITLE здесь не
      # задаём: одна запечённая строка перекрыла бы мультиязычность словаря.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      # Родительские DSH_DESKTOP_* вырезаются упаковщиком: настройки берутся
      # только из этого файла. DSH_PACKAGING_PRESET оставляем незаданным —
      # иначе нужен DSH_PACKAGING_CONFIG_DIR с presets/<preset>.env.
      - name: Write packaging settings file
        run: |
          cat > apps/desktop/.env.windows <<'EOF'
          DSH_DESKTOP_APP_ID=com.deepseek.dsh
          DSH_DESKTOP_AUTO_UPDATE_ENV=production
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://localhost
          DSH_DESKTOP_WINDOWS_COMPRESSION_LEVEL=3
          EOF

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Быстрая диагностика: конфиг + инструменталка (vswhere/tar) до долгой сборки.
      - name: Check packaging configuration and toolchain
        run: pnpm run package:desktop:win:x64:unsigned --check

      - name: Build unsigned Windows installer
        run: pnpm run package:desktop:win:x64:unsigned

      # Диагностика для публичного просмотра: логи джоба анонимно недоступны (403),
      # а ::error:: попадают в аннотации check-run, которые видны без авторизации.
      - name: Publish packaging journal tail
        if: failure()
        run: |
          RUN_DIR=$(ls -1dt apps/desktop/.desktop-build/packaging-runs/*/ 2>/dev/null | head -1 || true)
          if [ -z "$RUN_DIR" ]; then echo "::error::no packaging-runs journal directory"; exit 0; fi
          echo "journal: $RUN_DIR"
          tail_lines() { tr '\r\n' '\n\n' < "$1" | tail -n "$2" | tr '\n' '|' ; }
          [ -f "$RUN_DIR/stderr.log" ] && echo "::error::stderr tail: $(tail_lines "$RUN_DIR/stderr.log" 80)"
          [ -f "$RUN_DIR/stdout.log" ] && echo "::error::stdout tail: $(tail_lines "$RUN_DIR/stdout.log" 40)"
          [ -f "$RUN_DIR/events.jsonl" ] && echo "::error::events tail: $(tail -n 12 "$RUN_DIR/events.jsonl" | tr '\n' '|')"

      - name: Retain installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dsh-windows-unsigned-${{ github.sha }}
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error
          retention-days: 14

      # Релиз attach-ится к доверенному тегу-триггеру ($GITHUB_REF_NAME):
      # повторный прогон того же тега перезаписывает .exe (--clobber).
      # Заодно зачищаются legacy-релизы старого именования desktop-windows-*.
      - name: Publish installer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="$GITHUB_REF_NAME"
          EXE=$(ls apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe | head -1)
          NOTES="Неподписанный Windows-установщик (x64) сборки $VERSION с личным брендом Featured DSH. Доверенный тег: $TAG, коммит: $GITHUB_SHA. Запуск через SmartScreen «Run anyway»."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$EXE" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$EXE" --latest=false \
              --title "Windows installer $VERSION (unsigned, Featured DSH)" \
              --prerelease --notes "$NOTES"
          fi
          # Пересоздание тега (git push origin :refs/tags/...) превращает
          # привязанный релиз в draft — публикуем явно, upload/edit draft не отменяют.
          gh release edit "$TAG" --draft=false --latest=false --prerelease
          for FLAGS in "" "--draft"; do
            for OLD in $(gh release list --limit 100 $FLAGS --json tagName --jq '.[].tagName | select(startswith("desktop-windows-"))'); do
              gh release delete "$OLD" --yes --cleanup-tag
            done
          done

  # Портативный linux-x64 бандл: ноутбук скачивает релизный .tar.gz и запускает
  # ./run-dsh-web.sh без pnpm install и pnpm run build. Бандл = рабочее дерево
  # после полного build (lib/types, bundles, Web dist) + node_modules вместе +
  # переносной Node той же версии, что собирала runner. Раннер ubuntu = glibc
  # x86-64: native аддон и node-pty совместимы с Arch. Ждёт windows-джобу,
  # чтобы не спорить с ней за создание релиза.
  linux-portable:
    needs: windows-installer
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace artifacts
        run: pnpm run build

      - name: Assemble portable bundle
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          NODE_V=$(node -p "process.versions.node")
          DIST=$(mktemp -d)
          mkdir -p "$DIST/bundle/node" "$DIST/bundle/dsh"
          curl -fsSL "https://nodejs.org/dist/v${NODE_V}/node-v${NODE_V}-linux-x64.tar.xz" | tar -xJ -C "$DIST/bundle/node" --strip-components=1
          tar -C . -cf - --exclude=./.git --exclude=./.github --exclude=./apps/desktop/.desktop-build --exclude=./apps/desktop/.env.windows . | tar -C "$DIST/bundle/dsh" -xf -
          cat > "$DIST/bundle/run-dsh-web.sh" <<'RUNNER'
          #!/usr/bin/env bash
          # Портативный запуск Web UI из распакованного бандла: свой Node, без pnpm.
          set -euo pipefail
          HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$HERE/dsh"
          exec "$HERE/node/bin/node" --import tsx/esm apps/cli/src/bin.ts web "$@"
          RUNNER
          chmod +x "$DIST/bundle/run-dsh-web.sh"
          OUT="deepseek-harness-${VERSION}-linux-x64-portable.tar.gz"
          tar -C "$DIST/bundle" -cf - node dsh run-dsh-web.sh | gzip -1 > "$RUNNER_TEMP/$OUT"
          echo "ASSET=$RUNNER_TEMP/$OUT"
          du -h "$RUNNER_TEMP/$OUT"

      - name: Publish portable bundle release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          ASSET=$(ls "$RUNNER_TEMP"/*-linux-x64-portable.tar.gz | head -1)
          gh release upload "$TAG" "$ASSET" --clobber
